<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny send_destination="org.bluez" send_interface="org.ns_os.Switch2Enrollment1"/>
    <deny receive_interface="org.ns_os.Switch2Enrollment1"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.bluez" send_interface="org.ns_os.Switch2Enrollment1"/>
    <allow receive_interface="org.ns_os.Switch2Enrollment1"/>
  </policy>
  <policy user="ns-controller">
    <allow send_destination="org.bluez" send_interface="org.ns_os.Switch2Enrollment1"/>
    <allow receive_interface="org.ns_os.Switch2Enrollment1"/>
  </policy>
</busconfig>
